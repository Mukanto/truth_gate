# The released Action exactly as `truth-gate init --ci` writes it (truth_gate/templates/truth-gate.yml): checkout@v4
# and Mukanto/truth_gate@v0.5.1, on a study that must pass. Only the target differs (the template's truthgate.toml
# is the user's own manifest).
name: Released Action (template)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truth-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Mukanto/truth_gate@v0.5.1
        with:
          target: tests/manifests/trial_example.toml
