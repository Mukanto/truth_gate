# The repository's own CI: the test suite, the tests of the three GHZ examples, and the Action on a study that passes.
# The Action uploads an artifact with a fixed name, so each workflow file uses it once (see action-fails.yml and
# action-release.yml for the other two runs of the Action).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test suite (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install numpy (the package's only dependency)
        run: python -m pip install numpy
      - name: Run the test suite
        run: python -m unittest discover -s tests

  ghz-examples:
    name: GHZ example tests (runs 1 to 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
      - name: Install the versions the runs were made with, and this package (the studies import truth_gate or kapi)
        run: |
          python -m pip install numpy==2.5.4 scipy==1.18.1 qiskit==2.6.2 qiskit-aer==0.18.2 qiskit-ibm-runtime==0.52.0
          python -m pip install -e .
      - name: Run 1
        working-directory: examples/ghz_heron
        run: python -B -m unittest tests_ghz
      - name: Run 2
        working-directory: examples/ghz_heron_run2
        run: python -B -m unittest tests_ghz2
      - name: Run 3
        working-directory: examples/ghz_heron_run3
        run: python -B -m unittest tests_ghz3

  action:
    name: Action from this commit (a study that must pass)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - id: tg
        uses: ./
        with:
          target: tests/manifests/trial_example.toml
      - name: The certificate output is set
        env:
          CERT: ${{ steps.tg.outputs.certificate }}
        run: |
          test -n "$CERT" && test -f "$CERT"
          echo "certificate: $CERT"
