[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "truth-gate"
version = "0.5.0"
description = "Pre-registration kit and falsifiability gate for computational studies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hazar Şimşek" }]
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.urls]
Repository = "https://github.com/Mukanto/truth_gate"

[project.scripts]
truth-gate = "truth_gate.cli:main"

[tool.setuptools]
packages = ["truth_gate", "kapi"]

[tool.setuptools.package-data]
truth_gate = ["templates/*"]
