# A3 manifest of examples/03_unit_epsilon_bug/fixed.py: the A2 manifest of the same pair with the criterion as a Node program (criterion A3, spec 0.6 section 14).
# Worlds, premise and control as in the A2 manifest; the Node criterion computes the `rate` pattern of that manifest.
[study]
name = "E5-20 illuminated detector"

[worlds.plus]
python = "world.py:plus"

[worlds.minus]
python = "world.py:minus"
change = "illumination off (pixel level 3.0 -> 0)"

[[criteria]]
id = "lit_fraction_gt_08"
command = ["node", "criterion.js"]
tolerances = { fraction = [0.8, 1.0] }

[[premises]]
id = "illumination"
role = "tested"
criteria = ["lit_fraction_gt_08"]
magnitude = [3.0, 1.0]
mutations = [ { op = "offset", column = "pixel", value = -3.0 } ]

[[controls]]
id = "negated"
criteria = ["lit_fraction_gt_08"]
mutations = [ { op = "sign_flip", column = "pixel" } ]

[external]
uses = ["criterion.js"]
